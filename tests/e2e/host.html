<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Хост встраивания (тест)</title>
<style>html,body{margin:0;background:#000}iframe{display:block;width:360px;height:640px;border:0}</style>
</head>
<body>
<!-- Игра ровно так, как её ставит бренд: iframe с ?embed=1. Оболочка шлёт
     postMessage только родителю — в верхнем окне контракт событий не виден. -->
<iframe id="game" title="Игра" allow="autoplay; fullscreen; clipboard-write"></iframe>
<script>
  window.__events = [];
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.source === "zv-game") window.__events.push(ev.data);
  });
  var q = new URLSearchParams(location.search);
  var src = "/?embed=1";
  if (q.get("seed")) src += "&seed=" + encodeURIComponent(q.get("seed"));
  document.getElementById("game").src = src;
</script>
</body>
</html>
